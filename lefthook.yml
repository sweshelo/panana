# Successful checks stay silent; failed jobs retain their diagnostic output.
lefthook: bun scripts/lefthook.ts
output:
  - failure

pre-commit:
  piped: true
  jobs:
    - name: format
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,html,md,yml,yaml}'
      run: bun scripts/quiet-check.ts format {staged_files}
      stage_fixed: true
    - name: checks
      group:
        parallel: true
        jobs:
          - name: lint
            glob: '*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}'
            run: bun scripts/quiet-check.ts lint {staged_files}
          - name: typecheck
            run: bun scripts/quiet-check.ts typecheck
          - name: test
            run: bun scripts/quiet-check.ts test
